[dev]
  command = "npm run dev:web"
  targetPort = 5173
  port = 8888
  publish = "dist"

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[[redirects]]
  from = "/api/stats/increment"
  to = "/.netlify/functions/stats-increment"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

[[redirects]]
  from = "/api/favicon"
  to = "/.netlify/functions/favicon"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
